# Static site served by nginx (Next.js `output: 'export'` -> /usr/share/nginx/html)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/x-font-ttf;

    # Next.js static export produces real .html files per route, so Map
    # /about -> /about.html style routes automatically via try_files.
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Cache hashed build assets aggressively (immutable).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
